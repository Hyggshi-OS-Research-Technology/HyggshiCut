name: Build Linux .deb

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  format:
    name: Formatting (clang-format)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang-format

      # Advisory for now: the tree predates .clang-format, so this reports
      # what would change without failing the build. Remove `|| true` once the
      # tree has been reformatted once, so new code cannot regress.
      - name: Check formatting
        run: |
          mapfile -t files < <(git ls-files '*.cpp' '*.h')
          echo "Checking ${#files[@]} files against .clang-format"
          clang-format --dry-run --Werror "${files[@]}" || true

  build-deb:
    name: Build HyggshiCut .deb (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    env:
      DEBEMAIL: hyggshidev@gmail.com
      DEBFULLNAME: HyggshiCut

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build & packaging dependencies
        run: |
          # Derived from debian/control so this list cannot drift away from
          # what the .deb actually declares. Also installs ninja, which the
          # CMake presets use as their generator.
          ./scripts/install-build-deps.sh
          sudo apt-get install -y --no-install-recommends ninja-build qt6-qpa-plugins

      - name: Build Debian package (.deb)
        run: |
          # dpkg-buildpackage outputs the .deb one level above the source dir
          dpkg-buildpackage -us -uc -b -j"$(nproc)"
          mkdir -p dist
          mv ../hyggshicut_*.deb dist/
          DEB_FILE="$(ls dist/hyggshicut_*.deb | head -n 1)"
          echo "Packaged: $DEB_FILE"
          echo "deb_file=$DEB_FILE" >> "$GITHUB_ENV"

      - name: Verify .deb package
        run: |
          file "${deb_file}"
          dpkg-deb --info "${deb_file}"
          dpkg-deb --contents "${deb_file}" | head -40

      - name: Build & run the offline core tests
        run: |
          # Tests are opt-in (HYGGSHICUT_BUILD_TESTS) and the .deb build above
          # does not touch them, so compile and run them here to keep them
          # from rotting. They need no display and no real media.
          #
          # Every test is registered with CTest in CMakeLists.txt, so this
          # runs the whole suite rather than a hand-maintained list that
          # silently omitted tests as they were added.
          cmake -S . -B build-tests -DCMAKE_BUILD_TYPE=Release -DHYGGSHICUT_BUILD_TESTS=ON
          cmake --build build-tests -j"$(nproc)"
          ctest --test-dir build-tests --output-on-failure

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: hyggshicut-linux-deb
          path: dist/*.deb
          if-no-files-found: error

      - name: Create GitHub Release (only for version tags)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEB_FILE: ${{ env.deb_file }}
        run: |
          # Build the notes with printf: an inline "\n" is not expanded by the
          # shell, so the old one-liner published a release body containing a
          # literal backslash-n. Failures are no longer swallowed by `|| true`.
          notes_file="$(mktemp)"
          printf '%s\n\n%s\n' \
            "Automatically built from tag **${GITHUB_REF_NAME}**." \
            '- Linux `.deb` package attached.' > "$notes_file"

          gh release create "${GITHUB_REF_NAME}" \
            "${DEB_FILE}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "HyggshiCut ${GITHUB_REF_NAME}" \
            --notes-file "$notes_file"