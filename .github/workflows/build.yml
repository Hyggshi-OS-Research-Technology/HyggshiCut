name: Build Linux .deb

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build-deb:
    name: Build HyggshiCut .deb (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    env:
      DEBEMAIL: hyggshidev@gmail.com
      DEBFULLNAME: HyggshiCut

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build & packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake pkg-config dpkg-dev debhelper \
            qt6-base-dev libqt6opengl6-dev \
            libavformat-dev libavcodec-dev libavutil-dev libswscale-dev \
            libswresample-dev libavfilter-dev \
            libmpv-dev libasound2-dev libgl-dev

      - name: Build Debian package (.deb)
        run: |
          # dpkg-buildpackage outputs the .deb one level above the source dir
          dpkg-buildpackage -us -uc -b -j"$(nproc)"
          mkdir -p dist
          mv ../hyggshicut_*.deb dist/
          DEB_FILE="$(ls dist/hyggshicut_*.deb | head -n 1)"
          echo "Packaged: $DEB_FILE"
          echo "deb_file=$DEB_FILE" >> "$GITHUB_ENV"

      - name: Verify .deb package
        run: |
          file "${deb_file}"
          dpkg-deb --info "${deb_file}"
          dpkg-deb --contents "${deb_file}" | head -40

      - name: Build & run the offline core tests
        run: |
          # Tests are opt-in (HYGGSHICUT_BUILD_TESTS) and the .deb build above
          # does not touch them, so compile+run the offline core test here to
          # keep it from rotting. It needs no display, no real media (it
          # generates its own tiny PNG) and spawns no ffmpeg process.
          cmake -S . -B build-tests -DCMAKE_BUILD_TYPE=Release -DHYGGSHICUT_BUILD_TESTS=ON
          cmake --build build-tests --target EffectLayerTest SegmentBoundTest ScreenRecorderTest -j"$(nproc)"
          ./build-tests/EffectLayerTest
          ./build-tests/SegmentBoundTest
          QT_QPA_PLATFORM=offscreen ./build-tests/ScreenRecorderTest

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: hyggshicut-linux-deb
          path: dist/*.deb
          if-no-files-found: error

      - name: Create GitHub Release (only for version tags)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEB_FILE: ${{ env.deb_file }}
        run: |
          # Build the notes with printf: an inline "\n" is not expanded by the
          # shell, so the old one-liner published a release body containing a
          # literal backslash-n. Failures are no longer swallowed by `|| true`.
          notes_file="$(mktemp)"
          printf '%s\n\n%s\n' \
            "Automatically built from tag **${GITHUB_REF_NAME}**." \
            '- Linux `.deb` package attached.' > "$notes_file"

          gh release create "${GITHUB_REF_NAME}" \
            "${DEB_FILE}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "HyggshiCut ${GITHUB_REF_NAME}" \
            --notes-file "$notes_file"